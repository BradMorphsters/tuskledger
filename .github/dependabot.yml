# Dependabot config — SECURITY UPDATES ONLY.
#
# History: this used to open weekly version-bump PRs (grouped patches +
# minors, separate majors) for pip, npm and GitHub Actions. For a
# single-maintainer, local-first app that produced a steady pile of
# unreviewed PRs (11 open at once on 2026-09-06, six of them majors that
# would break the app as written — recharts 3, react-router 7, lucide 1.x,
# plaid-python 39, …). The noise outweighed the value.
#
# `open-pull-requests-limit: 0` disables VERSION updates for an ecosystem
# while leaving Dependabot SECURITY updates on (those are governed by the
# repo's Security settings, not by this limit), so a real CVE in a
# dependency still gets a PR; routine bumps don't.
#
# To bring scheduled bumps back for one ecosystem, raise its limit and
# (optionally) restore the patch/minor groups from git history.

version: 2
updates:
  # ── Python (backend) ───────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    labels: ["dependencies", "backend"]

  # ── npm (frontend) ─────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    labels: ["dependencies", "frontend"]

  # ── npm (mobile / Expo) ────────────────────────────────────────────
  # Expo pins its SDK's native module versions; bumps must go through
  # `npx expo install`, never a bare version PR. Security-only here too.
  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    labels: ["dependencies", "mobile"]

  # ── GitHub Actions ─────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    labels: ["dependencies", "ci"]
