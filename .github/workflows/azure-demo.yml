name: Deploy demo to Azure

# Builds the demo image (Dockerfile seeds a fresh synthetic DB anchored to
# today), pushes it to GitHub Container Registry, and points the Azure web
# app at it. Runs on every push to main and once a day so the demo's dates
# stay current. GitHub signs in to Azure with OIDC — no Azure secret is
# stored in GitHub. Skipped until the AZURE_* repo variables exist.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * *'   # daily re-seed, 9:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-demo
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/bradmorphsters/tuskledger-demo

jobs:
  deploy:
    if: ${{ vars.AZURE_WEBAPP_NAME != '' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://demo.tuskledger.com
    permissions:
      contents: read
      packages: write   # push the image to ghcr.io
      id-token: write   # OIDC token for Azure
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tag
        run: echo "tag=${GITHUB_SHA::12}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          images: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}

      - name: Smoke check /api/health
        run: |
          url="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/health"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
            echo "attempt $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::$url did not return 200"
          exit 1
